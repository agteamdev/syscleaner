name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml curl
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(python3 -c 'import syscleaner; print(syscleaner.__version__)')"
      - run: make check
      - run: make deb
      - run: make appimage
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          body_path: .github/release-notes.md
          generate_release_notes: true
