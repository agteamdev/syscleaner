tasks:
  apt_clean:
    title: Cache do APT
    desc: Remove os .deb baixados de /var/cache/apt/archives e os arquivos obsoletos. Os pacotes são baixados novamente quando necessário.
  apt_autoremove:
    title: Pacotes não usados e kernels antigos (autoremove)
    desc: Remove dependências automáticas de pacotes desinstalados e kernels que o próprio sistema marcou como desnecessários. O kernel em uso nunca é tocado pelo apt.
  rc_configs:
    title: Restos de configuração de pacotes removidos (rc)
    desc: Pacotes removidos sem --purge deixam seus arquivos de configuração. A lista é escrita no registro.
  snap_old:
    title: Revisões antigas do Snap
    desc: Remove as revisões desativadas (antigas) dos snaps instalados; o snapd as mantém para reverter. A revisão atual de cada snap permanece. No Ubuntu costuma liberar gigabytes.
  dnf_clean:
    title: Cache do DNF (família Fedora / RHEL)
    desc: 'dnf clean all: remove os pacotes em cache e os metadados dos repositórios. Eles são baixados novamente quando necessário.'
  pacman_cache:
    title: Cache do Pacman (família Arch)
    desc: 'paccache -r: remove as versões de pacotes em cache, exceto as três últimas. Requer o pacote pacman-contrib.'
  zypper_clean:
    title: Cache do Zypper (openSUSE)
    desc: 'zypper clean --all: remove os pacotes em cache e os metadados dos repositórios.'
  journal:
    title: 'Registros do systemd: 2 semanas / máximo de 200 MB'
    desc: Remove entradas do journal com mais de 2 semanas e tudo o que passar de 200 MB (journalctl --vacuum).
  old_logs:
    title: Registros arquivados em /var/log (mais de 14 dias)
    desc: Remove registros arquivados (*.gz, *.xz, *.1 ... *.9, *.old) com mais de 14 dias. Os registros atuais e o journal do systemd não são tocados. O histórico dos registros antigos é perdido.
  crash_reports:
    title: Relatórios de falhas (/var/crash)
    desc: Exclui relatórios de falhas do Apport (Ubuntu / Linux Mint). Podem ser grandes e conter trechos da memória dos programas.
  coredumps:
    title: Despejos de memória (systemd-coredump)
    desc: Exclui os despejos guardados em /var/lib/systemd/coredump. O systemd os remove sozinho após alguns dias; aqui o espaço é liberado na hora.
  tmp:
    title: Arquivos temporários em /tmp com mais de 1 dia
    desc: 'Uma alternativa segura a rm -rf /tmp/*: arquivos recentes e sockets de programas em execução não são tocados.'
  var_tmp:
    title: Arquivos temporários em /var/tmp com mais de 30 dias
    desc: /var/tmp mantém arquivos entre reinicializações, por isso só são removidos os itens intocados há 30 dias. Um programa que dependa de um arquivo antigo ali pode precisar recriá-lo.
  thumbs:
    title: Cache de miniaturas
    desc: ~/.thumbnails e ~/.cache/thumbnails. As miniaturas são recriadas ao navegar pelas pastas.
  recent_docs:
    title: Lista de arquivos recentes
    desc: Limpa a lista de “documentos recentes” exibida por gerenciadores de arquivos e aplicativos (privacidade). Os arquivos em si não são tocados.
  trash:
    title: Esvaziar a lixeira
    desc: Exclui definitivamente tudo em ~/.local/share/Trash. Confira a lixeira antes!
  flatpak_cache:
    title: Cache de repositórios do Flatpak
    desc: ~/.cache/flatpak/system-cache.
  flatpak_unused:
    title: 'Flatpak: runtimes não usados'
    desc: flatpak uninstall --unused. Os dados dos aplicativos não são removidos.
  flatpak_app_caches:
    title: Caches de aplicativos Flatpak
    desc: Esvazia a pasta de cache de cada aplicativo Flatpak (~/.var/app/<app>/cache), que o Flatpak define como dados não essenciais. Feche os aplicativos antes; eles recriarão seus caches.
  deborphan:
    title: Pacotes órfãos (deborphan)
    desc: Remove pacotes dos quais nada depende. Falsos positivos são possíveis, então confira antes a lista na prévia. Requer o pacote deborphan.
  firefox_cache:
    title: Cache do Firefox
    desc: Exclui o cache em disco do Firefox (cache2) nas instalações normal, Snap e Flatpak. Senhas, histórico, favoritos e cookies são mantidos. As páginas carregarão mais devagar uma vez.
  chrome_cache:
    title: Cache do Google Chrome
    desc: Exclui a pasta de cache do Chrome (~/.cache/google-chrome, também Beta / Dev, e o cache do Flatpak). O perfil fica em ~/.config e não é tocado.
  chromium_cache:
    title: Cache do Chromium
    desc: Exclui a pasta de cache do Chromium nas instalações normal, Snap e Flatpak. O perfil fica em ~/.config e não é tocado.
  edge_cache:
    title: Cache do Microsoft Edge
    desc: Exclui a pasta de cache do Edge (~/.cache/microsoft-edge e o cache do Flatpak). O perfil fica em ~/.config e não é tocado.
  brave:
    title: Cache do navegador Brave
    desc: Exclui a pasta de cache do Brave (~/.cache/BraveSoftware e o cache do Flatpak). Histórico e senhas ficam em ~/.config e não são tocados; as abas carregarão um pouco mais devagar uma vez.
  vivaldi_cache:
    title: Cache do Vivaldi
    desc: Exclui a pasta de cache do Vivaldi (~/.cache/vivaldi). O perfil fica em ~/.config e não é tocado.
  opera_cache:
    title: Cache do Opera
    desc: Exclui a pasta de cache do Opera (~/.cache/opera). O perfil fica em ~/.config e não é tocado.
  npm:
    title: Cache do npm
    desc: npm cache clean --force.
  pip:
    title: Cache do pip
    desc: pip cache purge.
  pnpm_store:
    title: Armazenamento do pnpm (pacotes sem referência)
    desc: 'pnpm store prune: remove apenas os pacotes que nenhum projeto deste computador usa. É a forma recomendada; apagar todo o armazenamento não é.'
  yarn_classic:
    title: Cache global do Yarn (classic)
    desc: Remove o cache global do Yarn 1.x em ~/.cache/yarn. Os arquivos dos projetos não são tocados e os pacotes são baixados novamente na próxima instalação. (Os caches de projeto do Yarn 2+ permanecem intactos.)
  cargo_registry:
    title: Cache e fontes do registro do Cargo (Rust)
    desc: Remove ~/.cargo/registry/cache e ~/.cargo/registry/src. Os crates são baixados novamente na próxima compilação, então até lá as compilações offline não funcionam.
  gradle_caches:
    title: Caches do Gradle
    desc: Remove ~/.gradle/caches (muitas vezes vários GB). Pare antes os daemons do Gradle (gradle --stop). As dependências são baixadas novamente na próxima compilação.
  go:
    title: Cache do Go (build + modcache)
    desc: go clean -cache -modcache. Pode liberar gigabytes; as dependências são baixadas novamente.
  docker_img:
    title: 'Docker: imagens órfãs (dangling) e cache de build'
    desc: docker image prune + builder prune. Volumes, redes e imagens com tag não são tocados. Requer acesso ao docker sem sudo (grupo docker).
  docker_cont:
    title: 'Docker: contêineres parados'
    desc: 'docker container prune. Confira antes docker ps -a: um contêiner parado pode ainda ser necessário (por exemplo, uma stack do Portainer).'
  top_dirs:
    title: Maiores pastas em /
    desc: Quais diretórios ocupam mais espaço (para uma visão interativa, use a aba “Disco”).
  top_home:
    title: Maiores pastas na pasta pessoal
    desc: O que ocupa espaço em ~.
  big_files:
    title: Arquivos maiores que 500 MB
    desc: Procura arquivos grandes no sistema de arquivos raiz.
  debs:
    title: Arquivos .deb baixados manualmente em ~
    desc: Apenas uma lista; excluir ou não é decisão sua.
  big_logs:
    title: Registros grandes em /var/log (>50 MB)
    desc: Apenas uma lista, nada é excluído.
  kernels:
    title: Kernels instalados
    desc: O kernel em uso (uname -r) NUNCA deve ser removido.
  est:
    title: Conexões de rede atuais
    desc: ss -tunap state established.
  listen:
    title: Portas em escuta
    desc: Cada porta em escuta deve ser explicável (Docker, Portainer, Deluge...).
  ufw:
    title: Estado do firewall (ufw)
    desc: 'Se estiver desativado: sudo ufw enable.'
  logins:
    title: Logins
    desc: Últimos logins, tentativas falhas e quem está conectado agora.
  autostart:
    title: Inicialização automática e cron
    desc: Serviços ativados, unidades mais lentas na inicialização, tarefas cron e entradas de inicialização automática de aplicativos gráficos.
  recent:
    title: Arquivos do sistema alterados nos últimos 7 dias
    desc: '/usr/bin, /usr/local/bin, /etc: útil se algo parecer suspeito.'
  rkhunter:
    title: Verificação com rkhunter
    desc: Uma verificação longa à procura de rootkits.
  upgrade:
    title: Atualizar o sistema (apt update && upgrade)
    desc: 'Não é somente leitura: instala atualizações. Após atualizar o kernel é preciso reiniciar.'
