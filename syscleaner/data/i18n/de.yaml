tasks:
  apt_clean:
    title: APT-Cache
    desc: Entfernt heruntergeladene .deb-Dateien aus /var/cache/apt/archives sowie veraltete Archive. Pakete werden bei Bedarf erneut heruntergeladen.
  apt_autoremove:
    title: Nicht benötigte Pakete und alte Kernel (autoremove)
    desc: Entfernt automatisch installierte Abhängigkeiten gelöschter Pakete und Kernel, die das System selbst als überflüssig markiert hat. Der laufende Kernel wird von apt nie angetastet.
  rc_configs:
    title: Konfigurationsreste entfernter Pakete (rc)
    desc: Pakete, die ohne --purge entfernt wurden, hinterlassen ihre Konfigurationsdateien. Die Liste wird ins Protokoll geschrieben.
  snap_old:
    title: Alte Snap-Revisionen
    desc: Entfernt deaktivierte (alte) Revisionen installierter Snaps; snapd behält sie für ein Zurücksetzen. Die aktuelle Revision jedes Snaps bleibt erhalten. Unter Ubuntu werden damit meist Gigabytes frei.
  dnf_clean:
    title: DNF-Cache (Fedora / RHEL-Familie)
    desc: 'dnf clean all: entfernt zwischengespeicherte Pakete und Repository-Metadaten. Sie werden bei Bedarf erneut heruntergeladen.'
  pacman_cache:
    title: Pacman-Paketcache (Arch-Familie)
    desc: 'paccache -r: entfernt zwischengespeicherte Paketversionen bis auf die letzten drei. Benötigt das Paket pacman-contrib.'
  zypper_clean:
    title: Zypper-Cache (openSUSE)
    desc: 'zypper clean --all: entfernt zwischengespeicherte Pakete und Repository-Metadaten.'
  journal:
    title: 'systemd-Protokolle: 2 Wochen / höchstens 200 MB'
    desc: Entfernt Journal-Einträge, die älter als 2 Wochen sind, und alles über 200 MB (journalctl --vacuum).
  old_logs:
    title: Archivierte Protokolle in /var/log (älter als 14 Tage)
    desc: Entfernt archivierte Protokolle (*.gz, *.xz, *.1 ... *.9, *.old), die älter als 14 Tage sind. Aktuelle Protokolle und das systemd-Journal bleiben unberührt. Der Verlauf alter Protokolle geht verloren.
  crash_reports:
    title: Absturzberichte (/var/crash)
    desc: Löscht Absturzberichte von Apport (Ubuntu / Linux Mint). Sie können groß sein und Teile des Programmspeichers enthalten.
  coredumps:
    title: Core-Dumps (systemd-coredump)
    desc: Löscht gespeicherte Core-Dumps aus /var/lib/systemd/coredump. systemd entfernt sie nach einigen Tagen selbst; hier wird der Platz sofort frei.
  tmp:
    title: Temporäre Dateien in /tmp, älter als 1 Tag
    desc: 'Ein sicherer Ersatz für rm -rf /tmp/*: frische Dateien und Sockets laufender Programme bleiben unberührt.'
  var_tmp:
    title: Temporäre Dateien in /var/tmp, älter als 30 Tage
    desc: /var/tmp behält Dateien über Neustarts hinweg, daher werden nur Einträge entfernt, die seit 30 Tagen unberührt sind. Ein Programm, das dort eine alte Datei braucht, muss sie eventuell neu anlegen.
  thumbs:
    title: Miniaturansichten-Cache
    desc: ~/.thumbnails und ~/.cache/thumbnails. Miniaturansichten werden beim Durchsuchen von Ordnern neu erzeugt.
  recent_docs:
    title: Liste zuletzt verwendeter Dateien
    desc: Leert die Liste „Zuletzt verwendet“, die Dateimanager und Anwendungen anzeigen (Datenschutz). Die Dateien selbst bleiben unberührt.
  trash:
    title: Papierkorb leeren
    desc: Löscht alles in ~/.local/share/Trash endgültig. Prüfen Sie den Papierkorb vorher!
  flatpak_cache:
    title: Flatpak-Repository-Cache
    desc: ~/.cache/flatpak/system-cache.
  flatpak_unused:
    title: 'Flatpak: nicht verwendete Runtimes'
    desc: flatpak uninstall --unused. Anwendungsdaten werden nicht entfernt.
  flatpak_app_caches:
    title: Flatpak-App-Caches
    desc: Leert den Cache-Ordner jeder Flatpak-App (~/.var/app/<App>/cache), den Flatpak als nicht essenzielle App-Daten definiert. Schließen Sie die Apps vorher; sie bauen ihre Caches neu auf.
  deborphan:
    title: Verwaiste Pakete (deborphan)
    desc: Entfernt Pakete, von denen nichts abhängt. Fehlalarme sind möglich, prüfen Sie daher zuerst die Liste in der Vorschau. Benötigt das Paket deborphan.
  firefox_cache:
    title: Firefox-Cache
    desc: Löscht den Festplatten-Cache von Firefox (cache2) für die normale, die Snap- und die Flatpak-Installation. Passwörter, Verlauf, Lesezeichen und Cookies bleiben erhalten. Seiten laden einmalig langsamer.
  chrome_cache:
    title: Google-Chrome-Cache
    desc: Löscht den Cache-Ordner von Chrome (~/.cache/google-chrome, auch Beta / Dev, und den Flatpak-Cache). Das Profil liegt in ~/.config und bleibt unberührt.
  chromium_cache:
    title: Chromium-Cache
    desc: Löscht den Cache-Ordner von Chromium für die normale, die Snap- und die Flatpak-Installation. Das Profil liegt in ~/.config und bleibt unberührt.
  edge_cache:
    title: Microsoft-Edge-Cache
    desc: Löscht den Cache-Ordner von Edge (~/.cache/microsoft-edge und den Flatpak-Cache). Das Profil liegt in ~/.config und bleibt unberührt.
  brave:
    title: Brave-Browser-Cache
    desc: Löscht den Cache-Ordner von Brave (~/.cache/BraveSoftware und den Flatpak-Cache). Verlauf und Passwörter liegen in ~/.config und bleiben unberührt; Tabs laden einmalig etwas langsamer.
  vivaldi_cache:
    title: Vivaldi-Cache
    desc: Löscht den Cache-Ordner von Vivaldi (~/.cache/vivaldi). Das Profil liegt in ~/.config und bleibt unberührt.
  opera_cache:
    title: Opera-Cache
    desc: Löscht den Cache-Ordner von Opera (~/.cache/opera). Das Profil liegt in ~/.config und bleibt unberührt.
  npm:
    title: npm-Cache
    desc: npm cache clean --force.
  pip:
    title: pip-Cache
    desc: pip cache purge.
  pnpm_store:
    title: pnpm-Store (nicht referenzierte Pakete)
    desc: 'pnpm store prune: entfernt nur Pakete, die kein Projekt auf diesem Rechner verwendet. Das ist der empfohlene Weg; den ganzen Store zu löschen ist es nicht.'
  yarn_classic:
    title: Globaler Yarn-Cache (Classic)
    desc: Entfernt den globalen Yarn-1.x-Cache in ~/.cache/yarn. Projektdateien bleiben unberührt, Pakete werden bei der nächsten Installation erneut heruntergeladen. (Projekt-Caches von Yarn 2+ bleiben unberührt.)
  cargo_registry:
    title: Cargo-Registry-Cache und -Quellen (Rust)
    desc: Entfernt ~/.cargo/registry/cache und ~/.cargo/registry/src. Crates werden beim nächsten Build erneut heruntergeladen, Offline-Builds funktionieren bis dahin nicht.
  gradle_caches:
    title: Gradle-Caches
    desc: Entfernt ~/.gradle/caches (oft mehrere GB). Beenden Sie vorher die Gradle-Daemons (gradle --stop). Abhängigkeiten werden beim nächsten Build erneut heruntergeladen.
  go:
    title: Go-Cache (Build + Modcache)
    desc: go clean -cache -modcache. Kann Gigabytes freigeben; Abhängigkeiten werden erneut heruntergeladen.
  docker_img:
    title: 'Docker: ungenutzte (dangling) Images und Build-Cache'
    desc: docker image prune + builder prune. Volumes, Netzwerke und getaggte Images bleiben unberührt. Benötigt Docker-Zugriff ohne sudo (Gruppe docker).
  docker_cont:
    title: 'Docker: gestoppte Container'
    desc: 'docker container prune. Prüfen Sie vorher docker ps -a: Ein gestoppter Container kann noch gebraucht werden (zum Beispiel ein Portainer-Stack).'
  top_dirs:
    title: Größte Ordner in /
    desc: Welche Verzeichnisse den meisten Platz belegen (eine interaktive Ansicht bietet der Tab „Datenträger“).
  top_home:
    title: Größte Ordner im Home-Verzeichnis
    desc: Was in ~ den Platz belegt.
  big_files:
    title: Dateien über 500 MB
    desc: Sucht große Dateien auf dem Root-Dateisystem.
  debs:
    title: Manuell heruntergeladene .deb-Dateien in ~
    desc: Nur eine Liste; ob Sie löschen, entscheiden Sie.
  big_logs:
    title: Große Protokolle in /var/log (>50 MB)
    desc: Nur eine Liste, es wird nichts gelöscht.
  kernels:
    title: Installierte Kernel
    desc: Der laufende Kernel (uname -r) darf NIEMALS entfernt werden.
  est:
    title: Aktuelle Netzwerkverbindungen
    desc: ss -tunap state established.
  listen:
    title: Lauschende Ports
    desc: Jeder lauschende Port sollte erklärbar sein (Docker, Portainer, Deluge ...).
  ufw:
    title: Firewall-Status (ufw)
    desc: 'Falls deaktiviert: sudo ufw enable.'
  logins:
    title: Anmeldungen
    desc: Letzte Anmeldungen, fehlgeschlagene Versuche und wer gerade angemeldet ist.
  autostart:
    title: Autostart und Cron
    desc: Aktivierte Dienste, die langsamsten Einheiten beim Start, Cron-Jobs und Autostart-Einträge grafischer Anwendungen.
  recent:
    title: Systemdateien, die in den letzten 7 Tagen geändert wurden
    desc: /usr/bin, /usr/local/bin, /etc – nützlich, wenn etwas verdächtig aussieht.
  rkhunter:
    title: rkhunter-Scan
    desc: Ein langer Rootkit-Scan.
  upgrade:
    title: System aktualisieren (apt update && upgrade)
    desc: 'Nicht nur lesend: installiert Updates. Nach einem Kernel-Update ist ein Neustart nötig.'
