tasks:
  apt_clean:
    title: Cache APT
    desc: Supprime les fichiers .deb téléchargés dans /var/cache/apt/archives ainsi que les archives obsolètes. Les paquets sont retéléchargés en cas de besoin.
  apt_autoremove:
    title: Paquets inutilisés et anciens noyaux (autoremove)
    desc: Supprime les dépendances installées automatiquement des paquets désinstallés et les noyaux que le système a lui-même marqués comme inutiles. Le noyau en cours d’utilisation n’est jamais touché par apt.
  rc_configs:
    title: Fichiers de configuration résiduels de paquets supprimés (rc)
    desc: Les paquets supprimés sans --purge laissent leurs fichiers de configuration. La liste est écrite dans le journal.
  snap_old:
    title: Anciennes révisions Snap
    desc: Supprime les révisions désactivées (anciennes) des snaps installés ; snapd les conserve pour permettre un retour en arrière. La révision actuelle de chaque snap est conservée. Sous Ubuntu, cela libère souvent des gigaoctets.
  dnf_clean:
    title: Cache DNF (famille Fedora / RHEL)
    desc: 'dnf clean all : supprime les paquets en cache et les métadonnées des dépôts. Ils sont retéléchargés en cas de besoin.'
  pacman_cache:
    title: Cache Pacman (famille Arch)
    desc: 'paccache -r : supprime les versions de paquets en cache sauf les trois dernières. Nécessite le paquet pacman-contrib.'
  zypper_clean:
    title: Cache Zypper (openSUSE)
    desc: 'zypper clean --all : supprime les paquets en cache et les métadonnées des dépôts.'
  journal:
    title: 'Journaux systemd : 2 semaines / 200 Mo maximum'
    desc: Supprime les entrées du journal de plus de 2 semaines et tout ce qui dépasse 200 Mo (journalctl --vacuum).
  old_logs:
    title: Journaux archivés dans /var/log (de plus de 14 jours)
    desc: Supprime les journaux archivés (*.gz, *.xz, *.1 ... *.9, *.old) de plus de 14 jours. Les journaux actuels et le journal systemd ne sont pas touchés. L’historique des anciens journaux est perdu.
  crash_reports:
    title: Rapports de plantage (/var/crash)
    desc: Supprime les rapports de plantage d’Apport (Ubuntu / Linux Mint). Ils peuvent être volumineux et contenir des fragments de la mémoire des programmes.
  coredumps:
    title: Vidages mémoire (systemd-coredump)
    desc: Supprime les vidages mémoire stockés dans /var/lib/systemd/coredump. systemd les supprime de lui-même après quelques jours ; ici, l’espace est libéré immédiatement.
  tmp:
    title: Fichiers temporaires de /tmp de plus d’un jour
    desc: 'Un remplacement sûr de rm -rf /tmp/* : les fichiers récents et les sockets des programmes en cours ne sont pas touchés.'
  var_tmp:
    title: Fichiers temporaires de /var/tmp de plus de 30 jours
    desc: /var/tmp conserve les fichiers entre les redémarrages ; seuls les éléments intacts depuis 30 jours sont donc supprimés. Un programme qui dépend d’un ancien fichier de ce dossier devra peut-être le recréer.
  thumbs:
    title: Cache des miniatures
    desc: ~/.thumbnails et ~/.cache/thumbnails. Les miniatures sont régénérées lorsque vous parcourez les dossiers.
  recent_docs:
    title: Liste des fichiers récents
    desc: Vide la liste des « documents récents » affichée par les gestionnaires de fichiers et les applications (confidentialité). Les fichiers eux-mêmes ne sont pas touchés.
  trash:
    title: Vider la corbeille
    desc: Supprime définitivement tout le contenu de ~/.local/share/Trash. Vérifiez la corbeille avant !
  flatpak_cache:
    title: Cache des dépôts Flatpak
    desc: ~/.cache/flatpak/system-cache.
  flatpak_unused:
    title: 'Flatpak : runtimes inutilisés'
    desc: flatpak uninstall --unused. Les données des applications ne sont pas supprimées.
  flatpak_app_caches:
    title: Caches des applications Flatpak
    desc: Vide le dossier de cache de chaque application Flatpak (~/.var/app/<app>/cache), que Flatpak définit comme données non essentielles. Fermez d’abord les applications ; elles reconstruiront leurs caches.
  deborphan:
    title: Paquets orphelins (deborphan)
    desc: 'Supprime les paquets dont plus rien ne dépend. Des faux positifs sont possibles : consultez d’abord la liste dans l’aperçu. Nécessite le paquet deborphan.'
  firefox_cache:
    title: Cache de Firefox
    desc: Supprime le cache disque de Firefox (cache2) pour les installations normale, Snap et Flatpak. Mots de passe, historique, marque-pages et cookies sont conservés. Les pages se chargeront plus lentement une fois.
  chrome_cache:
    title: Cache de Google Chrome
    desc: Supprime le dossier de cache de Chrome (~/.cache/google-chrome, aussi Beta / Dev, et le cache Flatpak). Le profil se trouve dans ~/.config et n’est pas touché.
  chromium_cache:
    title: Cache de Chromium
    desc: Supprime le dossier de cache de Chromium pour les installations normale, Snap et Flatpak. Le profil se trouve dans ~/.config et n’est pas touché.
  edge_cache:
    title: Cache de Microsoft Edge
    desc: Supprime le dossier de cache d’Edge (~/.cache/microsoft-edge et le cache Flatpak). Le profil se trouve dans ~/.config et n’est pas touché.
  brave:
    title: Cache du navigateur Brave
    desc: Supprime le dossier de cache de Brave (~/.cache/BraveSoftware et le cache Flatpak). L’historique et les mots de passe se trouvent dans ~/.config et ne sont pas touchés ; les onglets se chargeront un peu plus lentement une fois.
  vivaldi_cache:
    title: Cache de Vivaldi
    desc: Supprime le dossier de cache de Vivaldi (~/.cache/vivaldi). Le profil se trouve dans ~/.config et n’est pas touché.
  opera_cache:
    title: Cache d’Opera
    desc: Supprime le dossier de cache d’Opera (~/.cache/opera). Le profil se trouve dans ~/.config et n’est pas touché.
  npm:
    title: Cache npm
    desc: npm cache clean --force.
  pip:
    title: Cache pip
    desc: pip cache purge.
  pnpm_store:
    title: Magasin pnpm (paquets non référencés)
    desc: 'pnpm store prune : supprime uniquement les paquets qu’aucun projet de cet ordinateur n’utilise. C’est la méthode recommandée ; supprimer tout le magasin ne l’est pas.'
  yarn_classic:
    title: Cache global de Yarn (classic)
    desc: Supprime le cache global de Yarn 1.x dans ~/.cache/yarn. Les fichiers des projets ne sont pas touchés et les paquets seront retéléchargés à la prochaine installation. (Les caches de projet de Yarn 2+ restent intacts.)
  cargo_registry:
    title: Cache et sources du registre Cargo (Rust)
    desc: Supprime ~/.cargo/registry/cache et ~/.cargo/registry/src. Les crates sont retéléchargés lors de la prochaine compilation ; les compilations hors ligne ne fonctionnent donc pas d’ici là.
  gradle_caches:
    title: Caches Gradle
    desc: Supprime ~/.gradle/caches (souvent plusieurs Go). Arrêtez d’abord les démons Gradle (gradle --stop). Les dépendances sont retéléchargées lors de la prochaine compilation.
  go:
    title: Cache Go (build + modcache)
    desc: go clean -cache -modcache. Peut libérer des gigaoctets ; les dépendances sont retéléchargées.
  docker_img:
    title: 'Docker : images orphelines (dangling) et cache de build'
    desc: docker image prune + builder prune. Les volumes, les réseaux et les images étiquetées ne sont pas touchés. Nécessite un accès à docker sans sudo (groupe docker).
  docker_cont:
    title: 'Docker : conteneurs arrêtés'
    desc: 'docker container prune. Vérifiez d’abord docker ps -a : un conteneur arrêté peut encore être nécessaire (par exemple une pile Portainer).'
  top_dirs:
    title: Plus gros dossiers dans /
    desc: Quels répertoires occupent le plus de place (pour une vue interactive, voir l’onglet « Disque »).
  top_home:
    title: Plus gros dossiers du dossier personnel
    desc: Ce qui occupe la place dans ~.
  big_files:
    title: Fichiers de plus de 500 Mo
    desc: Recherche les gros fichiers sur le système de fichiers racine.
  debs:
    title: Fichiers .deb téléchargés manuellement dans ~
    desc: Une simple liste ; à vous de décider de supprimer ou non.
  big_logs:
    title: Gros journaux dans /var/log (>50 Mo)
    desc: Liste uniquement, rien n’est supprimé.
  kernels:
    title: Noyaux installés
    desc: Le noyau en cours d’utilisation (uname -r) ne doit JAMAIS être supprimé.
  est:
    title: Connexions réseau actuelles
    desc: ss -tunap state established.
  listen:
    title: Ports en écoute
    desc: Chaque port en écoute doit pouvoir être expliqué (Docker, Portainer, Deluge...).
  ufw:
    title: État du pare-feu (ufw)
    desc: 'S’il est désactivé : sudo ufw enable.'
  logins:
    title: Connexions
    desc: Dernières connexions, tentatives échouées et utilisateurs connectés en ce moment.
  autostart:
    title: Démarrage automatique et cron
    desc: Services activés, unités les plus lentes au démarrage, tâches cron et entrées de démarrage automatique des applications graphiques.
  recent:
    title: Fichiers système modifiés ces 7 derniers jours
    desc: '/usr/bin, /usr/local/bin, /etc : utile si quelque chose paraît suspect.'
  rkhunter:
    title: Analyse rkhunter
    desc: Une longue analyse à la recherche de rootkits.
  upgrade:
    title: Mettre à jour le système (apt update && upgrade)
    desc: 'Pas seulement en lecture : installe les mises à jour. Un redémarrage est nécessaire après une mise à jour du noyau.'
