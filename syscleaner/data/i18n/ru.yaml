groups:
  clean: "🧹 Система и пакеты"
  browsers: "🌐 Браузеры"
  dev: "🛠 Инструменты разработчика и контейнеры"
  find: "🔎 Поиск мусора (только чтение)"
  security: "🔐 Диагностика и безопасность"

tasks:
  apt_clean:
    title: "Кэш APT"
    desc: "Удаляет скачанные .deb из /var/cache/apt/archives и устаревшие архивы. Нужные пакеты при необходимости скачаются заново."
  apt_autoremove:
    title: "Неиспользуемые пакеты и старые ядра (autoremove)"
    desc: "Убирает автозависимости удалённых пакетов и ядра, которые система сама пометила ненужными. Текущее ядро apt не трогает."
  rc_configs:
    title: "Остатки конфигов удалённых пакетов (rc)"
    desc: "Пакеты, удалённые без --purge, оставляют конфиги. Список выводится в лог."
  journal:
    title: "Логи systemd: 2 недели / максимум 200 МБ"
    desc: "Удаляет записи журнала старше 2 недель и всё сверх 200 МБ (journalctl --vacuum)."
  tmp:
    title: "Временные файлы в /tmp старше суток"
    desc: "Безопасная замена rm -rf /tmp/*: свежие файлы и сокеты работающих программ не трогаются."
  thumbs:
    title: "Кэш миниатюр"
    desc: "~/.thumbnails и ~/.cache/thumbnails. Миниатюры пересоздадутся при просмотре папок."
  brave:
    title: "Кэш браузера Brave"
    desc: "Удаляет папку кэша Brave (~/.cache/BraveSoftware и кэш Flatpak). История и пароли лежат в ~/.config и не затрагиваются; вкладки один раз загрузятся медленнее."
  flatpak_cache:
    title: "Кэш репозиториев Flatpak"
    desc: "~/.cache/flatpak/system-cache."
  trash:
    title: "Очистить корзину"
    desc: "Безвозвратно удаляет всё в ~/.local/share/Trash. Проверь корзину перед запуском!"
  npm:
    title: "Кэш npm"
    desc: "npm cache clean --force."
  pip:
    title: "Кэш pip"
    desc: "pip cache purge."
  go:
    title: "Кэш Go (build + modcache)"
    desc: "go clean -cache -modcache. Может освободить гигабайты; зависимости скачаются заново."
  flatpak_unused:
    title: "Flatpak: неиспользуемые рантаймы"
    desc: "flatpak uninstall --unused. Данные приложений не удаляются."
  docker_img:
    title: "Docker: «висячие» образы и кэш сборки"
    desc: "docker image prune + builder prune. Тома, сети и именованные образы не трогаются. Нужен доступ к docker без sudo (группа docker)."
  docker_cont:
    title: "Docker: остановленные контейнеры"
    desc: "docker container prune. Сначала посмотри docker ps -a: остановленный контейнер может быть нужным (например, стек Portainer)."
  deborphan:
    title: "Пакеты-сироты (deborphan)"
    desc: "Удаляет пакеты, на которые никто не ссылается. Возможны ложные срабатывания — смотри список в предпросмотре. Нужен пакет deborphan."
  top_dirs:
    title: "Самые большие папки в /"
    desc: "Какие каталоги занимают больше всего места (интерактивный вариант — на вкладке «Диск»)."
  top_home:
    title: "Самые большие папки в домашней директории"
    desc: "Что съедает место в ~."
  big_files:
    title: "Файлы больше 500 МБ"
    desc: "Поиск крупных файлов на корневом разделе."
  debs:
    title: "Скачанные вручную .deb в ~"
    desc: "Просто список — удалять решаешь сам."
  big_logs:
    title: "Крупные логи в /var/log (>50 МБ)"
    desc: "Только список, ничего не удаляется."
  kernels:
    title: "Установленные ядра"
    desc: "Текущее ядро (uname -r) удалять НЕЛЬЗЯ."
  est:
    title: "Текущие сетевые соединения"
    desc: "ss -tunap state established."
  listen:
    title: "Слушающие порты"
    desc: "Каждый порт должен быть объясним (Docker, Portainer, Deluge…)."
  ufw:
    title: "Статус firewall (ufw)"
    desc: "Если выключен: sudo ufw enable."
  logins:
    title: "Входы в систему"
    desc: "Последние входы, неудачные попытки, кто залогинен сейчас."
  autostart:
    title: "Автозапуск и cron"
    desc: "Включённые сервисы, самые медленные при загрузке, кроны и автозапуск GUI-приложений."
  recent:
    title: "Системные файлы, изменённые за 7 дней"
    desc: "/usr/bin, /usr/local/bin, /etc — если что-то смущает."
  rkhunter:
    title: "Проверка rkhunter"
    desc: "Долгая проверка на руткиты."
  upgrade:
    title: "Обновить систему (apt update && upgrade)"
    desc: "Не только чтение — ставит обновления. После обновления ядра нужна перезагрузка."
  snap_old:
    title: "Старые ревизии Snap"
    desc: "Удаляет отключённые (старые) ревизии установленных snap-пакетов: snapd хранит их для отката. Текущая ревизия каждого пакета остаётся. На Ubuntu обычно освобождает гигабайты."
  dnf_clean:
    title: "Кэш DNF (Fedora / семейство RHEL)"
    desc: "dnf clean all: удаляет кэш пакетов и метаданные репозиториев. При необходимости они скачаются заново."
  pacman_cache:
    title: "Кэш Pacman (семейство Arch)"
    desc: "paccache -r: удаляет версии пакетов в кэше, кроме трёх последних. Нужен пакет pacman-contrib."
  zypper_clean:
    title: "Кэш Zypper (openSUSE)"
    desc: "zypper clean --all: удаляет кэш пакетов и метаданные репозиториев."
  old_logs:
    title: "Архивные логи в /var/log (старше 14 дней)"
    desc: "Удаляет архивные логи (*.gz, *.xz, *.1 ... *.9, *.old) старше 14 дней. Текущие логи и журнал systemd не затрагиваются. История старых логов будет потеряна."
  crash_reports:
    title: "Отчёты о сбоях (/var/crash)"
    desc: "Удаляет отчёты о сбоях Apport (Ubuntu / Linux Mint). Они бывают большими и могут содержать фрагменты памяти программ."
  coredumps:
    title: "Дампы памяти (systemd-coredump)"
    desc: "Удаляет сохранённые дампы из /var/lib/systemd/coredump. systemd сам чистит их через несколько дней; здесь место освобождается сразу."
  var_tmp:
    title: "Временные файлы в /var/tmp старше 30 дней"
    desc: "/var/tmp сохраняет файлы между перезагрузками, поэтому удаляется только то, к чему не прикасались 30 дней. Программе, которой нужен старый файл оттуда, придётся создать его заново."
  recent_docs:
    title: "Список недавних файлов"
    desc: "Очищает список «недавних документов», который показывают файловые менеджеры и приложения (приватность). Сами файлы не затрагиваются."
  flatpak_app_caches:
    title: "Кэши приложений Flatpak"
    desc: "Очищает папку кэша каждого Flatpak-приложения (~/.var/app/<приложение>/cache): по правилам Flatpak это несущественные данные. Сначала закрой приложения; кэш они пересоздадут."
  firefox_cache:
    title: "Кэш Firefox"
    desc: "Удаляет дисковый кэш Firefox (cache2) для обычной, Snap- и Flatpak-установки. Пароли, история, закладки и cookies сохраняются. Страницы один раз загрузятся медленнее."
  chrome_cache:
    title: "Кэш Google Chrome"
    desc: "Удаляет папку кэша Chrome (~/.cache/google-chrome, а также Beta / Dev и кэш Flatpak). Профиль лежит в ~/.config и не затрагивается."
  chromium_cache:
    title: "Кэш Chromium"
    desc: "Удаляет папку кэша Chromium для обычной, Snap- и Flatpak-установки. Профиль лежит в ~/.config и не затрагивается."
  edge_cache:
    title: "Кэш Microsoft Edge"
    desc: "Удаляет папку кэша Edge (~/.cache/microsoft-edge и кэш Flatpak). Профиль лежит в ~/.config и не затрагивается."
  vivaldi_cache:
    title: "Кэш Vivaldi"
    desc: "Удаляет папку кэша Vivaldi (~/.cache/vivaldi). Профиль лежит в ~/.config и не затрагивается."
  opera_cache:
    title: "Кэш Opera"
    desc: "Удаляет папку кэша Opera (~/.cache/opera). Профиль лежит в ~/.config и не затрагивается."
  pnpm_store:
    title: "Хранилище pnpm (неиспользуемые пакеты)"
    desc: "pnpm store prune: удаляет только пакеты, которые не использует ни один проект на этом компьютере. Это рекомендуемый способ, удалять хранилище целиком не стоит."
  yarn_classic:
    title: "Глобальный кэш Yarn (classic)"
    desc: "Удаляет глобальный кэш Yarn 1.x в ~/.cache/yarn. Файлы проектов не затрагиваются, пакеты скачаются заново при следующей установке. (Кэши проектов Yarn 2+ не трогаются.)"
  cargo_registry:
    title: "Кэш и исходники реестра Cargo (Rust)"
    desc: "Удаляет ~/.cargo/registry/cache и ~/.cargo/registry/src. Крейты скачаются заново при следующей сборке, поэтому до этого офлайн-сборка не работает."
  gradle_caches:
    title: "Кэши Gradle"
    desc: "Удаляет ~/.gradle/caches (часто несколько ГБ). Сначала останови демоны Gradle (gradle --stop). Зависимости скачаются заново при следующей сборке."
