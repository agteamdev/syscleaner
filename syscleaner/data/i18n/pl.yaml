tasks:
  apt_clean:
    title: Pamięć podręczna APT
    desc: Usuwa pobrane pliki .deb z /var/cache/apt/archives oraz przestarzałe archiwa. W razie potrzeby pakiety zostaną pobrane ponownie.
  apt_autoremove:
    title: Nieużywane pakiety i stare jądra (autoremove)
    desc: Usuwa automatycznie zainstalowane zależności usuniętych pakietów oraz jądra, które system sam oznaczył jako niepotrzebne. Używane jądro nigdy nie jest ruszane przez apt.
  rc_configs:
    title: Pozostałości konfiguracji usuniętych pakietów (rc)
    desc: Pakiety usunięte bez --purge zostawiają pliki konfiguracyjne. Lista jest zapisywana w dzienniku.
  snap_old:
    title: Stare rewizje Snap
    desc: Usuwa wyłączone (stare) rewizje zainstalowanych snapów; snapd trzyma je na wypadek cofnięcia zmian. Bieżąca rewizja każdego snapa zostaje. W Ubuntu zwykle zwalnia gigabajty.
  dnf_clean:
    title: Pamięć podręczna DNF (rodzina Fedora / RHEL)
    desc: 'dnf clean all: usuwa pakiety z pamięci podręcznej i metadane repozytoriów. W razie potrzeby zostaną pobrane ponownie.'
  pacman_cache:
    title: Pamięć podręczna Pacmana (rodzina Arch)
    desc: 'paccache -r: usuwa wersje pakietów z pamięci podręcznej oprócz trzech ostatnich. Wymaga pakietu pacman-contrib.'
  zypper_clean:
    title: Pamięć podręczna Zyppera (openSUSE)
    desc: 'zypper clean --all: usuwa pakiety z pamięci podręcznej i metadane repozytoriów.'
  journal:
    title: 'Dzienniki systemd: 2 tygodnie / maksymalnie 200 MB'
    desc: Usuwa wpisy dziennika starsze niż 2 tygodnie oraz wszystko ponad 200 MB (journalctl --vacuum).
  old_logs:
    title: Zarchiwizowane dzienniki w /var/log (starsze niż 14 dni)
    desc: Usuwa zarchiwizowane dzienniki (*.gz, *.xz, *.1 ... *.9, *.old) starsze niż 14 dni. Bieżące dzienniki i dziennik systemd pozostają nietknięte. Historia starych dzienników zostanie utracona.
  crash_reports:
    title: Raporty o awariach (/var/crash)
    desc: Usuwa raporty o awariach Apport (Ubuntu / Linux Mint). Mogą być duże i zawierać fragmenty pamięci programów.
  coredumps:
    title: Zrzuty pamięci (systemd-coredump)
    desc: Usuwa zapisane zrzuty z /var/lib/systemd/coredump. systemd sam usuwa je po kilku dniach; tutaj miejsce zwalnia się od razu.
  tmp:
    title: Pliki tymczasowe w /tmp starsze niż 1 dzień
    desc: 'Bezpieczny zamiennik rm -rf /tmp/*: świeże pliki i gniazda działających programów nie są ruszane.'
  var_tmp:
    title: Pliki tymczasowe w /var/tmp starsze niż 30 dni
    desc: /var/tmp zachowuje pliki między restartami, więc usuwane są tylko wpisy, których nie ruszano od 30 dni. Program zależny od starego pliku stamtąd może musieć utworzyć go ponownie.
  thumbs:
    title: Pamięć podręczna miniatur
    desc: ~/.thumbnails i ~/.cache/thumbnails. Miniatury są tworzone ponownie podczas przeglądania folderów.
  recent_docs:
    title: Lista ostatnio używanych plików
    desc: Czyści listę „ostatnich dokumentów” pokazywaną przez menedżery plików i aplikacje (prywatność). Same pliki nie są ruszane.
  trash:
    title: Opróżnij kosz
    desc: Bezpowrotnie usuwa wszystko w ~/.local/share/Trash. Sprawdź kosz przed uruchomieniem!
  flatpak_cache:
    title: Pamięć podręczna repozytoriów Flatpak
    desc: ~/.cache/flatpak/system-cache.
  flatpak_unused:
    title: 'Flatpak: nieużywane środowiska uruchomieniowe'
    desc: flatpak uninstall --unused. Dane aplikacji nie są usuwane.
  flatpak_app_caches:
    title: Pamięci podręczne aplikacji Flatpak
    desc: Opróżnia folder pamięci podręcznej każdej aplikacji Flatpak (~/.var/app/<aplikacja>/cache), który Flatpak definiuje jako dane nieistotne. Najpierw zamknij aplikacje; odbudują swoje pamięci podręczne.
  deborphan:
    title: Osierocone pakiety (deborphan)
    desc: Usuwa pakiety, od których nic nie zależy. Możliwe są fałszywe alarmy, dlatego najpierw sprawdź listę w podglądzie. Wymaga pakietu deborphan.
  firefox_cache:
    title: Pamięć podręczna Firefoksa
    desc: Usuwa pamięć podręczną dysku Firefoksa (cache2) dla instalacji zwykłej, Snap i Flatpak. Hasła, historia, zakładki i ciasteczka zostają. Strony załadują się raz wolniej.
  chrome_cache:
    title: Pamięć podręczna Google Chrome
    desc: Usuwa folder pamięci podręcznej Chrome (~/.cache/google-chrome, także Beta / Dev, oraz pamięć podręczna Flatpak). Profil leży w ~/.config i nie jest ruszany.
  chromium_cache:
    title: Pamięć podręczna Chromium
    desc: Usuwa folder pamięci podręcznej Chromium dla instalacji zwykłej, Snap i Flatpak. Profil leży w ~/.config i nie jest ruszany.
  edge_cache:
    title: Pamięć podręczna Microsoft Edge
    desc: Usuwa folder pamięci podręcznej Edge (~/.cache/microsoft-edge oraz pamięć podręczna Flatpak). Profil leży w ~/.config i nie jest ruszany.
  brave:
    title: Pamięć podręczna przeglądarki Brave
    desc: Usuwa folder pamięci podręcznej Brave (~/.cache/BraveSoftware oraz pamięć podręczna Flatpak). Historia i hasła leżą w ~/.config i nie są ruszane; karty załadują się raz nieco wolniej.
  vivaldi_cache:
    title: Pamięć podręczna Vivaldi
    desc: Usuwa folder pamięci podręcznej Vivaldi (~/.cache/vivaldi). Profil leży w ~/.config i nie jest ruszany.
  opera_cache:
    title: Pamięć podręczna Opery
    desc: Usuwa folder pamięci podręcznej Opery (~/.cache/opera). Profil leży w ~/.config i nie jest ruszany.
  npm:
    title: Pamięć podręczna npm
    desc: npm cache clean --force.
  pip:
    title: Pamięć podręczna pip
    desc: pip cache purge.
  pnpm_store:
    title: Magazyn pnpm (pakiety bez odwołań)
    desc: 'pnpm store prune: usuwa tylko pakiety, których nie używa żaden projekt na tym komputerze. To zalecany sposób; usuwanie całego magazynu nim nie jest.'
  yarn_classic:
    title: Globalna pamięć podręczna Yarn (classic)
    desc: Usuwa globalną pamięć podręczną Yarn 1.x w ~/.cache/yarn. Pliki projektów nie są ruszane, a pakiety zostaną pobrane ponownie przy następnej instalacji. (Pamięci podręczne projektów Yarn 2+ pozostają nietknięte.)
  cargo_registry:
    title: Pamięć podręczna i źródła rejestru Cargo (Rust)
    desc: Usuwa ~/.cargo/registry/cache i ~/.cargo/registry/src. Crate'y zostaną pobrane ponownie przy następnej kompilacji, więc do tego czasu kompilacja offline nie działa.
  gradle_caches:
    title: Pamięci podręczne Gradle
    desc: Usuwa ~/.gradle/caches (często kilka GB). Najpierw zatrzymaj demony Gradle (gradle --stop). Zależności zostaną pobrane ponownie przy następnej kompilacji.
  go:
    title: Pamięć podręczna Go (build + modcache)
    desc: go clean -cache -modcache. Może zwolnić gigabajty; zależności zostaną pobrane ponownie.
  docker_img:
    title: 'Docker: nieużywane (dangling) obrazy i pamięć podręczna budowania'
    desc: docker image prune + builder prune. Woluminy, sieci i obrazy z tagami nie są ruszane. Wymaga dostępu do dockera bez sudo (grupa docker).
  docker_cont:
    title: 'Docker: zatrzymane kontenery'
    desc: 'docker container prune. Najpierw sprawdź docker ps -a: zatrzymany kontener może być jeszcze potrzebny (na przykład stos Portainera).'
  top_dirs:
    title: Największe foldery w /
    desc: Które katalogi zajmują najwięcej miejsca (widok interaktywny jest na karcie „Dysk”).
  top_home:
    title: Największe foldery w katalogu domowym
    desc: Co zajmuje miejsce w ~.
  big_files:
    title: Pliki większe niż 500 MB
    desc: Szuka dużych plików w głównym systemie plików.
  debs:
    title: Ręcznie pobrane pliki .deb w ~
    desc: Zwykła lista; czy usuwać, decydujesz Ty.
  big_logs:
    title: Duże dzienniki w /var/log (>50 MB)
    desc: Tylko lista, nic nie jest usuwane.
  kernels:
    title: Zainstalowane jądra
    desc: Używanego jądra (uname -r) NIGDY nie wolno usuwać.
  est:
    title: Bieżące połączenia sieciowe
    desc: ss -tunap state established.
  listen:
    title: Porty nasłuchujące
    desc: Każdy nasłuchujący port powinien dać się wyjaśnić (Docker, Portainer, Deluge...).
  ufw:
    title: Stan zapory (ufw)
    desc: 'Jeśli jest wyłączona: sudo ufw enable.'
  logins:
    title: Logowania
    desc: Ostatnie logowania, nieudane próby i kto jest teraz zalogowany.
  autostart:
    title: Autostart i cron
    desc: Włączone usługi, najwolniejsze jednostki przy starcie, zadania cron i wpisy autostartu aplikacji graficznych.
  recent:
    title: Pliki systemowe zmienione w ciągu ostatnich 7 dni
    desc: /usr/bin, /usr/local/bin, /etc – przydatne, gdy coś wygląda podejrzanie.
  rkhunter:
    title: Skan rkhunter
    desc: Długi skan w poszukiwaniu rootkitów.
  upgrade:
    title: Aktualizuj system (apt update && upgrade)
    desc: 'Nie tylko odczyt: instaluje aktualizacje. Po aktualizacji jądra potrzebny jest restart.'
