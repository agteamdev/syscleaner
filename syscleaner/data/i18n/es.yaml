tasks:
  apt_clean:
    title: Caché de APT
    desc: Elimina los .deb descargados de /var/cache/apt/archives y los archivos obsoletos. Los paquetes se descargan de nuevo cuando hacen falta.
  apt_autoremove:
    title: Paquetes no usados y kernels antiguos (autoremove)
    desc: Elimina las dependencias automáticas de paquetes desinstalados y los kernels que el propio sistema marcó como innecesarios. apt nunca toca el kernel en uso.
  rc_configs:
    title: Restos de configuración de paquetes eliminados (rc)
    desc: Los paquetes eliminados sin --purge dejan sus archivos de configuración. La lista se escribe en el registro.
  snap_old:
    title: Revisiones antiguas de Snap
    desc: Elimina las revisiones desactivadas (antiguas) de los snaps instalados; snapd las conserva para poder volver atrás. La revisión actual de cada snap se mantiene. En Ubuntu suele liberar gigabytes.
  dnf_clean:
    title: Caché de DNF (familia Fedora / RHEL)
    desc: 'dnf clean all: elimina los paquetes en caché y los metadatos de los repositorios. Se descargan de nuevo cuando hacen falta.'
  pacman_cache:
    title: Caché de Pacman (familia Arch)
    desc: 'paccache -r: elimina las versiones de paquetes en caché salvo las tres últimas. Requiere el paquete pacman-contrib.'
  zypper_clean:
    title: Caché de Zypper (openSUSE)
    desc: 'zypper clean --all: elimina los paquetes en caché y los metadatos de los repositorios.'
  journal:
    title: 'Registros de systemd: 2 semanas / máximo 200 MB'
    desc: Elimina las entradas del diario con más de 2 semanas y todo lo que supere los 200 MB (journalctl --vacuum).
  old_logs:
    title: Registros archivados en /var/log (más de 14 días)
    desc: Elimina los registros archivados (*.gz, *.xz, *.1 ... *.9, *.old) con más de 14 días. Los registros actuales y el diario de systemd no se tocan. Se pierde el historial de registros antiguos.
  crash_reports:
    title: Informes de fallos (/var/crash)
    desc: Elimina los informes de fallos de Apport (Ubuntu / Linux Mint). Pueden ser grandes y contener fragmentos de la memoria de los programas.
  coredumps:
    title: Volcados de memoria (systemd-coredump)
    desc: Elimina los volcados guardados en /var/lib/systemd/coredump. systemd los borra solo al cabo de unos días; aquí el espacio se libera al instante.
  tmp:
    title: Archivos temporales de /tmp con más de 1 día
    desc: 'Una alternativa segura a rm -rf /tmp/*: los archivos recientes y los sockets de programas en ejecución no se tocan.'
  var_tmp:
    title: Archivos temporales de /var/tmp con más de 30 días
    desc: /var/tmp conserva los archivos entre reinicios, así que solo se eliminan los no tocados en 30 días. Un programa que dependa de un archivo antiguo de ahí tendrá que recrearlo.
  thumbs:
    title: Caché de miniaturas
    desc: ~/.thumbnails y ~/.cache/thumbnails. Las miniaturas se regeneran al explorar carpetas.
  recent_docs:
    title: Lista de archivos recientes
    desc: Vacía la lista de «documentos recientes» que muestran los gestores de archivos y las aplicaciones (privacidad). Los archivos en sí no se tocan.
  trash:
    title: Vaciar la papelera
    desc: Elimina definitivamente todo lo que hay en ~/.local/share/Trash. ¡Revisa la papelera antes!
  flatpak_cache:
    title: Caché de repositorios de Flatpak
    desc: ~/.cache/flatpak/system-cache.
  flatpak_unused:
    title: 'Flatpak: runtimes sin usar'
    desc: flatpak uninstall --unused. Los datos de las aplicaciones no se eliminan.
  flatpak_app_caches:
    title: Cachés de aplicaciones Flatpak
    desc: Vacía la carpeta de caché de cada aplicación Flatpak (~/.var/app/<app>/cache), que Flatpak define como datos no esenciales. Cierra antes las aplicaciones; reconstruirán sus cachés.
  deborphan:
    title: Paquetes huérfanos (deborphan)
    desc: Elimina paquetes de los que nada depende. Son posibles los falsos positivos, así que revisa antes la lista en la vista previa. Requiere el paquete deborphan.
  firefox_cache:
    title: Caché de Firefox
    desc: Elimina la caché de disco de Firefox (cache2) en las instalaciones normal, Snap y Flatpak. Se conservan contraseñas, historial, marcadores y cookies. Las páginas cargarán más despacio una vez.
  chrome_cache:
    title: Caché de Google Chrome
    desc: Elimina la carpeta de caché de Chrome (~/.cache/google-chrome, también Beta / Dev, y la caché de Flatpak). El perfil está en ~/.config y no se toca.
  chromium_cache:
    title: Caché de Chromium
    desc: Elimina la carpeta de caché de Chromium en las instalaciones normal, Snap y Flatpak. El perfil está en ~/.config y no se toca.
  edge_cache:
    title: Caché de Microsoft Edge
    desc: Elimina la carpeta de caché de Edge (~/.cache/microsoft-edge y la caché de Flatpak). El perfil está en ~/.config y no se toca.
  brave:
    title: Caché del navegador Brave
    desc: Elimina la carpeta de caché de Brave (~/.cache/BraveSoftware y la caché de Flatpak). El historial y las contraseñas están en ~/.config y no se tocan; las pestañas cargarán algo más despacio una vez.
  vivaldi_cache:
    title: Caché de Vivaldi
    desc: Elimina la carpeta de caché de Vivaldi (~/.cache/vivaldi). El perfil está en ~/.config y no se toca.
  opera_cache:
    title: Caché de Opera
    desc: Elimina la carpeta de caché de Opera (~/.cache/opera). El perfil está en ~/.config y no se toca.
  npm:
    title: Caché de npm
    desc: npm cache clean --force.
  pip:
    title: Caché de pip
    desc: pip cache purge.
  pnpm_store:
    title: Almacén de pnpm (paquetes sin referencias)
    desc: 'pnpm store prune: elimina solo los paquetes que ningún proyecto de este equipo usa. Es la forma recomendada; borrar todo el almacén no lo es.'
  yarn_classic:
    title: Caché global de Yarn (classic)
    desc: Elimina la caché global de Yarn 1.x en ~/.cache/yarn. Los archivos de los proyectos no se tocan y los paquetes se descargan de nuevo en la próxima instalación. (Las cachés de proyecto de Yarn 2+ no se tocan.)
  cargo_registry:
    title: Caché y fuentes del registro de Cargo (Rust)
    desc: Elimina ~/.cargo/registry/cache y ~/.cargo/registry/src. Los crates se descargan de nuevo en la próxima compilación, así que hasta entonces no funcionan las compilaciones sin conexión.
  gradle_caches:
    title: Cachés de Gradle
    desc: Elimina ~/.gradle/caches (a menudo varios GB). Detén antes los demonios de Gradle (gradle --stop). Las dependencias se descargan de nuevo en la próxima compilación.
  go:
    title: Caché de Go (build + modcache)
    desc: go clean -cache -modcache. Puede liberar gigabytes; las dependencias se descargan de nuevo.
  docker_img:
    title: 'Docker: imágenes huérfanas (dangling) y caché de compilación'
    desc: docker image prune + builder prune. Los volúmenes, las redes y las imágenes con etiqueta no se tocan. Requiere acceso a docker sin sudo (grupo docker).
  docker_cont:
    title: 'Docker: contenedores detenidos'
    desc: 'docker container prune. Revisa antes docker ps -a: un contenedor detenido puede seguir haciendo falta (por ejemplo, una pila de Portainer).'
  top_dirs:
    title: Carpetas más grandes en /
    desc: Qué directorios ocupan más espacio (para una vista interactiva, usa la pestaña «Disco»).
  top_home:
    title: Carpetas más grandes en tu carpeta personal
    desc: Qué ocupa espacio en ~.
  big_files:
    title: Archivos de más de 500 MB
    desc: Busca archivos grandes en el sistema de archivos raíz.
  debs:
    title: Archivos .deb descargados manualmente en ~
    desc: Solo una lista; borrar o no depende de ti.
  big_logs:
    title: Registros grandes en /var/log (>50 MB)
    desc: Solo una lista, no se elimina nada.
  kernels:
    title: Kernels instalados
    desc: El kernel en uso (uname -r) NUNCA debe eliminarse.
  est:
    title: Conexiones de red actuales
    desc: ss -tunap state established.
  listen:
    title: Puertos a la escucha
    desc: Cada puerto a la escucha debería poder explicarse (Docker, Portainer, Deluge...).
  ufw:
    title: Estado del cortafuegos (ufw)
    desc: 'Si está desactivado: sudo ufw enable.'
  logins:
    title: Inicios de sesión
    desc: Últimos inicios de sesión, intentos fallidos y quién está conectado ahora.
  autostart:
    title: Inicio automático y cron
    desc: Servicios activados, las unidades más lentas al arrancar, tareas cron y entradas de inicio automático de aplicaciones gráficas.
  recent:
    title: Archivos del sistema modificados en los últimos 7 días
    desc: '/usr/bin, /usr/local/bin, /etc: útil si algo parece sospechoso.'
  rkhunter:
    title: Análisis con rkhunter
    desc: Un análisis largo en busca de rootkits.
  upgrade:
    title: Actualizar el sistema (apt update && upgrade)
    desc: 'No es solo lectura: instala actualizaciones. Tras actualizar el kernel hay que reiniciar.'
