tasks:
  apt_clean:
    title: Кеш APT
    desc: Видаляє завантажені .deb із /var/cache/apt/archives і застарілі архіви. За потреби пакети завантажаться знову.
  apt_autoremove:
    title: Невикористані пакети та старі ядра (autoremove)
    desc: Прибирає автозалежності вилучених пакетів і ядра, які система сама позначила непотрібними. Поточне ядро apt не чіпає.
  rc_configs:
    title: Залишки конфігів вилучених пакетів (rc)
    desc: Пакети, вилучені без --purge, залишають конфіги. Список виводиться в журнал.
  snap_old:
    title: Старі ревізії Snap
    desc: 'Видаляє вимкнені (старі) ревізії встановлених snap-пакетів: snapd зберігає їх для відкоту. Поточна ревізія кожного пакета залишається. В Ubuntu зазвичай звільняє гігабайти.'
  dnf_clean:
    title: Кеш DNF (Fedora / родина RHEL)
    desc: 'dnf clean all: видаляє кеш пакетів і метадані репозиторіїв. За потреби вони завантажаться знову.'
  pacman_cache:
    title: Кеш Pacman (родина Arch)
    desc: 'paccache -r: видаляє версії пакетів у кеші, крім трьох останніх. Потрібен пакет pacman-contrib.'
  zypper_clean:
    title: Кеш Zypper (openSUSE)
    desc: 'zypper clean --all: видаляє кеш пакетів і метадані репозиторіїв.'
  journal:
    title: 'Журнали systemd: 2 тижні / максимум 200 МБ'
    desc: Видаляє записи журналу старші за 2 тижні та все понад 200 МБ (journalctl --vacuum).
  old_logs:
    title: Архівні журнали в /var/log (старші за 14 днів)
    desc: Видаляє архівні журнали (*.gz, *.xz, *.1 ... *.9, *.old) старші за 14 днів. Поточні журнали та журнал systemd не чіпаються. Історію старих журналів буде втрачено.
  crash_reports:
    title: Звіти про збої (/var/crash)
    desc: Видаляє звіти про збої Apport (Ubuntu / Linux Mint). Вони бувають великими й можуть містити фрагменти пам’яті програм.
  coredumps:
    title: Дампи пам’яті (systemd-coredump)
    desc: Видаляє збережені дампи з /var/lib/systemd/coredump. systemd сам чистить їх за кілька днів; тут місце звільняється відразу.
  tmp:
    title: Тимчасові файли в /tmp старші за добу
    desc: 'Безпечна заміна rm -rf /tmp/*: свіжі файли та сокети запущених програм не чіпаються.'
  var_tmp:
    title: Тимчасові файли в /var/tmp старші за 30 днів
    desc: /var/tmp зберігає файли між перезавантаженнями, тому видаляється лише те, чого не торкалися 30 днів. Програмі, якій потрібен старий файл звідти, доведеться створити його знову.
  thumbs:
    title: Кеш мініатюр
    desc: ~/.thumbnails і ~/.cache/thumbnails. Мініатюри створяться знову під час перегляду тек.
  recent_docs:
    title: Список нещодавніх файлів
    desc: Очищає список «нещодавніх документів», який показують файлові менеджери та програми (приватність). Самі файли не чіпаються.
  trash:
    title: Очистити кошик
    desc: Безповоротно видаляє все в ~/.local/share/Trash. Перевірте кошик перед запуском!
  flatpak_cache:
    title: Кеш репозиторіїв Flatpak
    desc: ~/.cache/flatpak/system-cache.
  flatpak_unused:
    title: 'Flatpak: невикористані рантайми'
    desc: flatpak uninstall --unused. Дані програм не видаляються.
  flatpak_app_caches:
    title: Кеші програм Flatpak
    desc: Очищає теку кешу кожної програми Flatpak (~/.var/app/<програма>/cache), яку Flatpak визначає як несуттєві дані. Спершу закрийте програми; кеш вони створять знову.
  deborphan:
    title: Пакети-сироти (deborphan)
    desc: Видаляє пакети, від яких ніщо не залежить. Можливі хибні спрацювання, тож перегляньте список у попередньому перегляді. Потрібен пакет deborphan.
  firefox_cache:
    title: Кеш Firefox
    desc: Видаляє дисковий кеш Firefox (cache2) для звичайного, Snap- і Flatpak-встановлення. Паролі, історія, закладки та cookies зберігаються. Сторінки один раз завантажаться повільніше.
  chrome_cache:
    title: Кеш Google Chrome
    desc: Видаляє теку кешу Chrome (~/.cache/google-chrome, а також Beta / Dev і кеш Flatpak). Профіль лежить у ~/.config і не зачіпається.
  chromium_cache:
    title: Кеш Chromium
    desc: Видаляє теку кешу Chromium для звичайного, Snap- і Flatpak-встановлення. Профіль лежить у ~/.config і не зачіпається.
  edge_cache:
    title: Кеш Microsoft Edge
    desc: Видаляє теку кешу Edge (~/.cache/microsoft-edge і кеш Flatpak). Профіль лежить у ~/.config і не зачіпається.
  brave:
    title: Кеш браузера Brave
    desc: Видаляє теку кешу Brave (~/.cache/BraveSoftware і кеш Flatpak). Історія та паролі лежать у ~/.config і не зачіпаються; вкладки один раз завантажаться трохи повільніше.
  vivaldi_cache:
    title: Кеш Vivaldi
    desc: Видаляє теку кешу Vivaldi (~/.cache/vivaldi). Профіль лежить у ~/.config і не зачіпається.
  opera_cache:
    title: Кеш Opera
    desc: Видаляє теку кешу Opera (~/.cache/opera). Профіль лежить у ~/.config і не зачіпається.
  npm:
    title: Кеш npm
    desc: npm cache clean --force.
  pip:
    title: Кеш pip
    desc: pip cache purge.
  pnpm_store:
    title: Сховище pnpm (невикористані пакети)
    desc: 'pnpm store prune: видаляє лише пакети, які не використовує жоден проєкт на цьому комп’ютері. Це рекомендований спосіб, видаляти сховище повністю не варто.'
  yarn_classic:
    title: Глобальний кеш Yarn (classic)
    desc: Видаляє глобальний кеш Yarn 1.x у ~/.cache/yarn. Файли проєктів не зачіпаються, пакети завантажаться знову під час наступного встановлення. (Кеші проєктів Yarn 2+ не чіпаються.)
  cargo_registry:
    title: Кеш і вихідні коди реєстру Cargo (Rust)
    desc: Видаляє ~/.cargo/registry/cache і ~/.cargo/registry/src. Крейти завантажаться знову під час наступної збірки, тож до того офлайн-збірка не працює.
  gradle_caches:
    title: Кеші Gradle
    desc: Видаляє ~/.gradle/caches (часто кілька ГБ). Спершу зупиніть демони Gradle (gradle --stop). Залежності завантажаться знову під час наступної збірки.
  go:
    title: Кеш Go (build + modcache)
    desc: go clean -cache -modcache. Може звільнити гігабайти; залежності завантажаться знову.
  docker_img:
    title: 'Docker: «висячі» образи та кеш збірки'
    desc: docker image prune + builder prune. Томи, мережі та іменовані образи не чіпаються. Потрібен доступ до docker без sudo (група docker).
  docker_cont:
    title: 'Docker: зупинені контейнери'
    desc: 'docker container prune. Спершу перегляньте docker ps -a: зупинений контейнер може бути потрібним (наприклад, стек Portainer).'
  top_dirs:
    title: Найбільші теки в /
    desc: Які каталоги займають найбільше місця (інтерактивний варіант — на вкладці «Диск»).
  top_home:
    title: Найбільші теки в домашньому каталозі
    desc: Що з’їдає місце в ~.
  big_files:
    title: Файли понад 500 МБ
    desc: Пошук великих файлів на кореневому розділі.
  debs:
    title: Вручну завантажені .deb у ~
    desc: Просто список — видаляти чи ні, вирішуєте ви.
  big_logs:
    title: Великі журнали в /var/log (>50 МБ)
    desc: Лише список, нічого не видаляється.
  kernels:
    title: Встановлені ядра
    desc: Поточне ядро (uname -r) видаляти НЕ МОЖНА.
  est:
    title: Поточні мережеві з’єднання
    desc: ss -tunap state established.
  listen:
    title: Порти, що слухають
    desc: Кожен порт має бути пояснюваним (Docker, Portainer, Deluge…).
  ufw:
    title: Стан firewall (ufw)
    desc: 'Якщо вимкнено: sudo ufw enable.'
  logins:
    title: Входи в систему
    desc: Останні входи, невдалі спроби, хто зараз увійшов.
  autostart:
    title: Автозапуск і cron
    desc: Увімкнені служби, найповільніші під час завантаження, cron-завдання та автозапуск графічних програм.
  recent:
    title: Системні файли, змінені за 7 днів
    desc: /usr/bin, /usr/local/bin, /etc — якщо щось насторожує.
  rkhunter:
    title: Перевірка rkhunter
    desc: Тривала перевірка на руткіти.
  upgrade:
    title: Оновити систему (apt update && upgrade)
    desc: Не лише читання — встановлює оновлення. Після оновлення ядра потрібне перезавантаження.
