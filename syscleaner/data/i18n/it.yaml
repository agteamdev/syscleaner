groups:
  clean: 🧹 Sistema e pacchetti
  browsers: 🌐 Browser
  dev: 🛠 Strumenti per sviluppatori e container
  find: 🔎 Ricerca di file inutili (sola lettura)
  security: 🔐 Diagnostica e sicurezza
tasks:
  apt_clean:
    title: Cache di APT
    desc: Rimuove i file .deb scaricati da /var/cache/apt/archives e gli archivi obsoleti. I pacchetti vengono scaricati di nuovo quando servono.
  apt_autoremove:
    title: Pacchetti inutilizzati e vecchi kernel (autoremove)
    desc: Rimuove le dipendenze automatiche dei pacchetti disinstallati e i kernel che il sistema stesso ha segnato come non necessari. Il kernel in uso non viene mai toccato da apt.
  rc_configs:
    title: Configurazioni residue di pacchetti rimossi (rc)
    desc: I pacchetti rimossi senza --purge lasciano i file di configurazione. L’elenco viene scritto nel registro.
  snap_old:
    title: Vecchie revisioni Snap
    desc: Rimuove le revisioni disattivate (vecchie) degli snap installati; snapd le conserva per il ripristino. La revisione corrente di ogni snap resta. Su Ubuntu libera di solito gigabyte.
  dnf_clean:
    title: Cache di DNF (famiglia Fedora / RHEL)
    desc: 'dnf clean all: rimuove i pacchetti in cache e i metadati dei repository. Vengono scaricati di nuovo quando servono.'
  pacman_cache:
    title: Cache di Pacman (famiglia Arch)
    desc: 'paccache -r: rimuove le versioni dei pacchetti in cache oltre le ultime tre. Richiede il pacchetto pacman-contrib.'
  zypper_clean:
    title: Cache di Zypper (openSUSE)
    desc: 'zypper clean --all: rimuove i pacchetti in cache e i metadati dei repository.'
  journal:
    title: 'Log di systemd: 2 settimane / massimo 200 MB'
    desc: Rimuove le voci del journal più vecchie di 2 settimane e tutto ciò che supera i 200 MB (journalctl --vacuum).
  old_logs:
    title: Log archiviati in /var/log (più vecchi di 14 giorni)
    desc: Rimuove i log archiviati (*.gz, *.xz, *.1 ... *.9, *.old) più vecchi di 14 giorni. I log correnti e il journal di systemd non vengono toccati. La cronologia dei vecchi log va persa.
  crash_reports:
    title: Segnalazioni di arresto anomalo (/var/crash)
    desc: Elimina le segnalazioni di arresto anomalo di Apport (Ubuntu / Linux Mint). Possono essere grandi e contenere frammenti della memoria dei programmi.
  coredumps:
    title: Core dump (systemd-coredump)
    desc: Elimina i core dump salvati in /var/lib/systemd/coredump. systemd li rimuove da solo dopo qualche giorno; qui lo spazio si libera subito.
  tmp:
    title: File temporanei in /tmp più vecchi di 1 giorno
    desc: 'Un’alternativa sicura a rm -rf /tmp/*: i file recenti e i socket dei programmi in esecuzione non vengono toccati.'
  var_tmp:
    title: File temporanei in /var/tmp più vecchi di 30 giorni
    desc: /var/tmp conserva i file tra i riavvii, quindi vengono rimossi solo gli elementi non toccati da 30 giorni. Un programma che dipende da un vecchio file lì potrebbe doverlo ricreare.
  thumbs:
    title: Cache delle miniature
    desc: ~/.thumbnails e ~/.cache/thumbnails. Le miniature vengono rigenerate quando sfogli le cartelle.
  recent_docs:
    title: Elenco dei file recenti
    desc: Svuota l’elenco dei «documenti recenti» mostrato da file manager e applicazioni (pulizia per la privacy). I file veri e propri non vengono toccati.
  trash:
    title: Svuota il cestino
    desc: Elimina definitivamente tutto in ~/.local/share/Trash. Controlla il cestino prima di procedere!
  flatpak_cache:
    title: Cache dei repository Flatpak
    desc: ~/.cache/flatpak/system-cache.
  flatpak_unused:
    title: 'Flatpak: runtime inutilizzati'
    desc: flatpak uninstall --unused. I dati delle applicazioni non vengono rimossi.
  flatpak_app_caches:
    title: Cache delle app Flatpak
    desc: Svuota la cartella cache di ogni app Flatpak (~/.var/app/<app>/cache), che Flatpak definisce come dati non essenziali dell’app. Chiudi prima le app; ricostruiranno le loro cache.
  deborphan:
    title: Pacchetti orfani (deborphan)
    desc: Rimuove i pacchetti da cui nulla dipende. Sono possibili falsi positivi, quindi controlla l’elenco nell’anteprima. Richiede il pacchetto deborphan.
  firefox_cache:
    title: Cache di Firefox
    desc: Elimina la cache su disco di Firefox (cache2) per le installazioni normale, Snap e Flatpak. Password, cronologia, segnalibri e cookie vengono conservati. Le pagine si caricheranno più lentamente una volta.
  chrome_cache:
    title: Cache di Google Chrome
    desc: Elimina la cartella della cache di Chrome (~/.cache/google-chrome, anche Beta / Dev, e la cache Flatpak). Il profilo si trova in ~/.config e non viene toccato.
  chromium_cache:
    title: Cache di Chromium
    desc: Elimina la cartella della cache di Chromium per le installazioni normale, Snap e Flatpak. Il profilo si trova in ~/.config e non viene toccato.
  edge_cache:
    title: Cache di Microsoft Edge
    desc: Elimina la cartella della cache di Edge (~/.cache/microsoft-edge e la cache Flatpak). Il profilo si trova in ~/.config e non viene toccato.
  brave:
    title: Cache del browser Brave
    desc: Elimina la cartella della cache di Brave (~/.cache/BraveSoftware e la cache Flatpak). Cronologia e password si trovano in ~/.config e non vengono toccate; le schede si caricano un po’ più lentamente una volta.
  vivaldi_cache:
    title: Cache di Vivaldi
    desc: Elimina la cartella della cache di Vivaldi (~/.cache/vivaldi). Il profilo si trova in ~/.config e non viene toccato.
  opera_cache:
    title: Cache di Opera
    desc: Elimina la cartella della cache di Opera (~/.cache/opera). Il profilo si trova in ~/.config e non viene toccato.
  npm:
    title: Cache di npm
    desc: npm cache clean --force.
  pip:
    title: Cache di pip
    desc: pip cache purge.
  pnpm_store:
    title: Store di pnpm (pacchetti non referenziati)
    desc: 'pnpm store prune: rimuove solo i pacchetti che nessun progetto su questo computer usa. È il metodo consigliato; eliminare l’intero store no.'
  yarn_classic:
    title: Cache globale di Yarn (classic)
    desc: Rimuove la cache globale di Yarn 1.x in ~/.cache/yarn. I file dei progetti non vengono toccati e i pacchetti vengono scaricati di nuovo alla prossima installazione. (Le cache dei progetti Yarn 2+ restano intatte.)
  cargo_registry:
    title: Cache e sorgenti del registro Cargo (Rust)
    desc: Rimuove ~/.cargo/registry/cache e ~/.cargo/registry/src. I crate vengono scaricati di nuovo alla prossima compilazione, quindi le build offline non funzionano fino ad allora.
  gradle_caches:
    title: Cache di Gradle
    desc: Rimuove ~/.gradle/caches (spesso diversi GB). Ferma prima i daemon di Gradle (gradle --stop). Le dipendenze vengono scaricate di nuovo alla prossima compilazione.
  go:
    title: Cache di Go (build + modcache)
    desc: go clean -cache -modcache. Può liberare gigabyte; le dipendenze vengono scaricate di nuovo.
  docker_img:
    title: 'Docker: immagini dangling e cache di build'
    desc: docker image prune + builder prune. Volumi, reti e immagini con tag non vengono toccati. Richiede accesso a docker senza sudo (gruppo docker).
  docker_cont:
    title: 'Docker: container fermi'
    desc: 'docker container prune. Controlla prima docker ps -a: un container fermo potrebbe servire ancora (ad esempio uno stack Portainer).'
  top_dirs:
    title: Cartelle più grandi in /
    desc: Quali directory occupano più spazio (per una vista interattiva vedi la scheda «Disco»).
  top_home:
    title: Cartelle più grandi nella home
    desc: Cosa occupa spazio in ~.
  big_files:
    title: File più grandi di 500 MB
    desc: Cerca i file grandi sul file system root.
  debs:
    title: File .deb scaricati manualmente in ~
    desc: Un semplice elenco; eliminare o meno sta a te.
  big_logs:
    title: Log grandi in /var/log (>50 MB)
    desc: Solo elenco, non viene eliminato nulla.
  kernels:
    title: Kernel installati
    desc: Il kernel in uso (uname -r) non va MAI rimosso.
  est:
    title: Connessioni di rete attive
    desc: ss -tunap state established.
  listen:
    title: Porte in ascolto
    desc: Ogni porta in ascolto dovrebbe essere spiegabile (Docker, Portainer, Deluge...).
  ufw:
    title: Stato del firewall (ufw)
    desc: 'Se è disattivato: sudo ufw enable.'
  logins:
    title: Accessi
    desc: Accessi recenti, tentativi falliti e chi è connesso in questo momento.
  autostart:
    title: Avvio automatico e cron
    desc: Servizi attivi, unità più lente all’avvio, job cron e voci di avvio automatico delle applicazioni grafiche.
  recent:
    title: File di sistema modificati negli ultimi 7 giorni
    desc: '/usr/bin, /usr/local/bin, /etc: utile se qualcosa sembra sospetto.'
  rkhunter:
    title: Scansione con rkhunter
    desc: Una lunga scansione alla ricerca di rootkit.
  upgrade:
    title: Aggiorna il sistema (apt update && upgrade)
    desc: 'Non è sola lettura: installa gli aggiornamenti. Dopo un aggiornamento del kernel serve un riavvio.'
