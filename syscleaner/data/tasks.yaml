# Встроенные задачи SysCleaner.
# Свои задачи кладите в ~/.config/syscleaner/tasks.d/*.yaml (тот же формат).
#
# Поля задачи:
#   id        уникальный идентификатор (латиница, без пробелов)
#   group     id группы из списка groups
#   title     название в списке
#   desc      объяснение: что делает и чем рискуем
#   cmd       bash-команда (для root: true — БЕЗ sudo, запустится через pkexec)
#   root      нужны ли права root (по умолчанию false)
#   risk      safe | caution | danger
#   default   отмечена ли по умолчанию
#   requires  программа, без которой задача недоступна (серая в списке)
#   estimate  команда, последняя строка вывода которой — число байт (предпросмотр);
#             доступна функция sz ПУТЬ... — суммарный размер путей в байтах
#   preview   команда, показывающая, что будет затронуто (предпросмотр)
#   schedule  true — задачу можно поставить в расписание (danger нельзя никогда)
#   disabled  true — скрыть встроенную задачу с таким id (в пользовательском файле)

groups:
  - {id: clean,    title: "🧹 Очистка"}
  - {id: find,     title: "🔎 Поиск мусора (только чтение)"}
  - {id: security, title: "🔐 Диагностика и безопасность"}

tasks:
  # ───────────── ОЧИСТКА ─────────────
  - id: apt_clean
    group: clean
    title: "Кэш apt"
    desc: >-
      Удаляет скачанные .deb из /var/cache/apt/archives и устаревшие архивы.
      Нужные пакеты при необходимости скачаются заново.
    cmd: apt-get clean && apt-get autoclean
    root: true
    default: true
    schedule: true
    estimate: sz /var/cache/apt/archives
    preview: ls -lh /var/cache/apt/archives/*.deb 2>/dev/null | head -20; true

  - id: apt_autoremove
    group: clean
    title: "Неиспользуемые пакеты и старые ядра (autoremove)"
    desc: >-
      Убирает автозависимости удалённых пакетов и ядра, помеченные системой как ненужные.
      Текущее ядро apt не трогает.
    cmd: apt-get autoremove --purge -y
    root: true
    risk: caution
    default: true
    preview: apt-get -s autoremove --purge | grep '^Remv' | head -40; true
    estimate: |
      apt-get -s autoremove --purge 2>/dev/null | awk '/disk space will be freed/ {gsub(",","",$4); m=($5=="kB")?1024:(($5=="MB")?1048576:(($5=="GB")?1073741824:1)); printf "%d\n", $4*m}'

  - id: rc_configs
    group: clean
    title: "Остатки конфигов удалённых пакетов (rc)"
    desc: >-
      Пакеты, удалённые без --purge, оставляют конфиги. Список выводится в лог.
    cmd: |
      L=$(dpkg -l | awk '/^rc/ {print $2}'); echo "Найдено: ${L:-нет}"
      [ -n "$L" ] && echo "$L" | xargs -r apt-get purge -y || true
    root: true
    default: true
    schedule: true
    preview: dpkg -l | awk '/^rc/ {print $2}'; true

  - id: journal
    group: clean
    title: "Логи systemd: 2 недели / максимум 200 МБ"
    desc: Удаляет записи журнала старше 2 недель и всё сверх 200 МБ (journalctl --vacuum).
    cmd: |
      journalctl --disk-usage
      journalctl --vacuum-time=2weeks
      journalctl --vacuum-size=200M
      journalctl --disk-usage
    root: true
    default: true
    schedule: true
    preview: journalctl --disk-usage
    estimate: |
      s=$(sz /var/log/journal); [ "${s:-0}" -gt 209715200 ] && echo $((s-209715200)) || echo 0

  - id: tmp
    group: clean
    title: "Временные файлы /tmp старше суток"
    desc: >-
      Безопасная замена rm -rf /tmp/*: свежие файлы и сокеты работающих программ не трогаются.
    cmd: find /tmp -mindepth 1 -mtime +1 -delete 2>/dev/null || true
    root: true
    default: true
    schedule: true
    preview: find /tmp -mindepth 1 -mtime +1 2>/dev/null | head -30; true
    estimate: |
      find /tmp -mindepth 1 -mtime +1 -print0 2>/dev/null | du -sbc --files0-from=- 2>/dev/null | tail -1 | cut -f1

  - id: thumbs
    group: clean
    title: "Кэш миниатюр"
    desc: ~/.thumbnails и ~/.cache/thumbnails. Миниатюры пересоздадутся при просмотре папок.
    cmd: rm -rf ~/.thumbnails/* ~/.cache/thumbnails/* 2>/dev/null; echo ok
    default: true
    schedule: true
    estimate: sz ~/.thumbnails ~/.cache/thumbnails

  - id: brave
    group: clean
    title: "Кэш браузера Brave"
    desc: >-
      Только ~/.cache/BraveSoftware. История и пароли лежат в ~/.config и не затрагиваются;
      вкладки один раз загрузятся медленнее.
    cmd: rm -rf ~/.cache/BraveSoftware/* 2>/dev/null; echo ok
    risk: caution
    estimate: sz ~/.cache/BraveSoftware

  - id: flatpak_cache
    group: clean
    title: "Кэш flatpak"
    desc: ~/.cache/flatpak/system-cache.
    cmd: rm -rf ~/.cache/flatpak/system-cache 2>/dev/null; echo ok
    requires: flatpak
    estimate: sz ~/.cache/flatpak/system-cache

  - id: trash
    group: clean
    title: "Очистить корзину"
    desc: Безвозвратно удаляет всё в ~/.local/share/Trash. Проверь корзину перед запуском!
    cmd: rm -rf ~/.local/share/Trash/files/* ~/.local/share/Trash/info/* ~/.local/share/Trash/expunged 2>/dev/null; echo ok
    risk: caution
    preview: ls -la ~/.local/share/Trash/files | head -30
    estimate: sz ~/.local/share/Trash/files

  - id: npm
    group: clean
    title: "Кэш npm"
    desc: npm cache clean --force.
    cmd: npm cache clean --force
    requires: npm
    schedule: true
    estimate: sz ~/.npm/_cacache

  - id: pip
    group: clean
    title: "Кэш pip"
    desc: pip cache purge.
    cmd: pip3 cache purge 2>/dev/null || python3 -m pip cache purge
    requires: pip3
    schedule: true
    estimate: sz ~/.cache/pip

  - id: go
    group: clean
    title: "Кэш Go (build + modcache)"
    desc: go clean -cache -modcache. Может освободить гигабайты; зависимости скачаются заново.
    cmd: go clean -cache -modcache
    risk: caution
    requires: go
    estimate: sz ~/.cache/go-build ~/go/pkg/mod

  - id: flatpak_unused
    group: clean
    title: "Flatpak: неиспользуемые рантаймы"
    desc: flatpak uninstall --unused. Данные приложений не удаляются.
    cmd: flatpak uninstall --unused -y
    requires: flatpak
    preview: flatpak uninstall --unused --assumeno 2>&1 | head -30

  - id: docker_img
    group: clean
    title: "Docker: «висячие» образы и кэш сборки"
    desc: >-
      docker image prune + builder prune. Тома, сети и именованные образы не трогаются.
      Нужен доступ к docker без sudo (группа docker).
    cmd: docker image prune -f; docker builder prune -f
    risk: caution
    requires: docker
    preview: docker images -f dangling=true

  - id: docker_cont
    group: clean
    title: "Docker: остановленные контейнеры"
    desc: >-
      docker container prune. Сначала посмотри docker ps -a: остановленный контейнер
      может быть нужным (например, стек Portainer).
    cmd: docker ps -a; docker container prune -f
    risk: danger
    requires: docker
    preview: docker ps -a -f status=exited -f status=created

  - id: deborphan
    group: clean
    title: "Пакеты-сироты (deborphan)"
    desc: >-
      Удаляет пакеты, на которые никто не ссылается. Возможны ложные срабатывания —
      смотри список в предпросмотре. Нужен пакет deborphan.
    cmd: |
      L=$(deborphan); echo "Сироты: ${L:-нет}"
      [ -n "$L" ] && apt-get purge --autoremove -y $L || true
    root: true
    risk: danger
    requires: deborphan
    preview: deborphan; true

  # ───────────── ПОИСК МУСОРА ─────────────
  - id: top_dirs
    group: find
    title: "Топ папок в /"
    desc: Какие каталоги занимают больше всего места (для интерактива см. вкладку «Диск»).
    cmd: du -h -x --max-depth=1 / 2>/dev/null | sort -hr | head -15
    root: true

  - id: top_home
    group: find
    title: "Топ папок в домашней директории"
    desc: Что съедает место в ~.
    cmd: du -h --max-depth=1 ~ 2>/dev/null | sort -hr | head -15

  - id: big_files
    group: find
    title: "Файлы больше 500 МБ"
    desc: Поиск крупных файлов на корневом разделе.
    cmd: find / -xdev -type f -size +500M -exec ls -lh {} + 2>/dev/null
    root: true

  - id: debs
    group: find
    title: "Скачанные вручную .deb в ~"
    desc: Просто список — удалять решаешь сам.
    cmd: find ~ -maxdepth 3 -name '*.deb' -exec ls -lh {} \;

  - id: big_logs
    group: find
    title: "Крупные логи в /var/log (>50 МБ)"
    desc: Только список, ничего не удаляется.
    cmd: find /var/log -type f -size +50M -exec ls -lh {} \;
    root: true

  - id: kernels
    group: find
    title: "Установленные ядра"
    desc: Текущее ядро (uname -r) удалять НЕЛЬЗЯ.
    cmd: |
      echo "Текущее: $(uname -r)"
      dpkg --list | grep -E 'linux-image|linux-headers'

  # ───────────── ДИАГНОСТИКА ─────────────
  - id: est
    group: security
    title: "Текущие сетевые соединения"
    desc: ss -tunap state established.
    cmd: ss -tunap state established
    root: true

  - id: listen
    group: security
    title: "Слушающие порты"
    desc: Каждый порт должен быть объясним (Docker, Portainer, Deluge…).
    cmd: ss -tulnp
    root: true

  - id: ufw
    group: security
    title: "Статус firewall (ufw)"
    desc: "Если выключен: sudo ufw enable."
    cmd: ufw status verbose
    root: true
    requires: ufw

  - id: logins
    group: security
    title: "Входы в систему"
    desc: Последние входы, неудачные попытки, кто залогинен сейчас.
    cmd: |
      last -a | head -20
      echo '--- неудачные ---'; lastb 2>/dev/null | head -20
      echo '--- сейчас ---'; who
    root: true

  - id: autostart
    group: security
    title: "Автозапуск и cron"
    desc: Включённые сервисы, самые медленные при загрузке, кроны, автозапуск GUI.
    cmd: |
      systemctl list-unit-files --state=enabled | grep -v '^systemd'
      echo; systemd-analyze blame | head -20
      echo '--- cron ---'; crontab -l 2>/dev/null
      ls ~/.config/autostart/ 2>/dev/null

  - id: recent
    group: security
    title: "Системные файлы, изменённые за 7 дней"
    desc: /usr/bin, /usr/local/bin, /etc — если что-то смущает.
    cmd: find /usr/bin /usr/local/bin /etc -mtime -7 -type f 2>/dev/null
    root: true

  - id: rkhunter
    group: security
    title: "Проверка rkhunter"
    desc: Долгая проверка на руткиты.
    cmd: rkhunter --check --sk
    root: true
    requires: rkhunter

  - id: upgrade
    group: security
    title: "Обновить систему (apt update && upgrade)"
    desc: "Не только чтение — ставит обновления. После обновления ядра нужна перезагрузка."
    cmd: apt-get update && apt-get upgrade -y
    root: true
    risk: caution
    requires: apt-get
